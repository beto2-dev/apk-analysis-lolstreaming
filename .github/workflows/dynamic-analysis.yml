name: Analisis dinamico en emulador Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analisis-dinamico:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias del host
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget unzip xz-utils python3-pip
          python3 -m pip install --quiet frida-tools mitmproxy
          echo "frida instalado: $(frida --version)"

      - name: Configurar SDK de Android
        run: |
          ANDROID_HOME=$HOME/android-sdk
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/clt.zip
          unzip -q /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "emulator" "build-tools;30.0.3" "system-images;android-30;google_apis;x86_64" >/dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Crear dispositivo virtual (AVD)
        run: |
          export ANDROID_USER_HOME=$HOME/.android
          export ANDROID_AVD_HOME=$HOME/.android/avd
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n auditoria -k "system-images;android-30;google_apis;x86_64" -d pixel_4 --force
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"

      - name: Habilitar acceso a KVM
        run: |
          ls -l /dev/kvm || echo "advertencia: /dev/kvm no existe"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check || true

      - name: Iniciar mitmdump en el host
        run: |
          mkdir -p dynamic/captures dynamic/logs dynamic/files_app
          nohup mitmdump --listen-host 127.0.0.1 --listen-port 8080 \
            -w dynamic/captures/traffic.mitm \
            -s scripts/dynamic/flow_logger.py > dynamic/logs/mitmdump.txt 2>&1 &
          sleep 5
          pgrep -a mitmdump || (echo "mitmdump no arranco" && cat dynamic/logs/mitmdump.txt)

      - name: Arrancar emulador (headless con proxy hacia el host)
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" start-server || true
          if ! "$ANDROID_HOME/emulator/emulator" -list-avds 2>/dev/null | grep -qx auditoria; then
            echo "AVD no visible para el emulador; recreando"
            mkdir -p "$ANDROID_AVD_HOME"
            echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n auditoria -k "system-images;android-30;google_apis;x86_64" -d pixel_4 --force
          fi
          nohup "$ANDROID_HOME/emulator/emulator" -avd auditoria \
            -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics \
            -gpu swiftshader_indirect -writable-system \
            -http-proxy http://10.0.2.2:8080 > dynamic/logs/emulator.txt 2>&1 &
          timeout 420 "$ADB" wait-for-device || true
          BOOT=0
          for i in $(seq 1 60); do
            B=$(timeout 15 "$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$B" = "1" ]; then echo "boot completado tras $((i*10))s"; BOOT=1; break; fi
            sleep 10
          done
          if [ "$BOOT" != "1" ]; then
            echo "## el emulador no completo el arranque; registro del emulador:"
            tail -60 dynamic/logs/emulator.txt || true
            exit 1
          fi
          "$ADB" devices

      - name: Instalar CA de mitmproxy (bind mount, sin reinicio)
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          H=$(openssl x509 -inform PEM -subject_hash_old -in ~/.mitmproxy/mitmproxy-ca.pem | head -1)
          echo "hash del certificado: $H"
          timeout 30 "$ADB" root || true
          sleep 6
          # copia del almacen de certificados a /data y montaje por bind
          timeout 30 "$ADB" shell "rm -rf /data/local/tmp/cacerts && mkdir -p /data/local/tmp/cacerts" || true
          timeout 60 "$ADB" shell "cp /system/etc/security/cacerts/* /data/local/tmp/cacerts/ 2>/dev/null; ls /data/local/tmp/cacerts | wc -l"
          timeout 30 "$ADB" push ~/.mitmproxy/mitmproxy-ca-cert.pem /data/local/tmp/cacerts/"${H}".0
          timeout 30 "$ADB" shell "chmod 644 /data/local/tmp/cacerts/*; chown root:root /data/local/tmp/cacerts/*" || true
          timeout 30 "$ADB" shell "mount -o bind /data/local/tmp/cacerts /system/etc/security/cacerts" \
            && echo "bind mount aplicado" \
            || echo "advertencia: bind mount rechazado; el trafico TLS no se descifrara"
          timeout 30 "$ADB" shell "ls -la /system/etc/security/cacerts/${H}.0" \
            || echo "confirmado: CA no visible en el almacen del sistema"
          # estabilizar adb
          for i in 1 2 3; do
            S=$(timeout 15 "$ADB" get-state 2>/dev/null | tr -d '\r')
            [ "$S" = "device" ] && break
            "$ADB" kill-server || true; "$ADB" start-server || true
            timeout 60 "$ADB" wait-for-device || true
            sleep 5
          done
          "$ADB" devices

      - name: Desplegar frida-server en el dispositivo
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          FV=$(python3 -c "import frida; print(frida.__version__)")
          echo "version de frida: $FV"
          wget -q "https://github.com/frida/frida/releases/download/${FV}/frida-server-${FV}-android-x86_64.xz" -O /tmp/fs.xz
          xz -d -f /tmp/fs.xz
          timeout 60 "$ADB" push /tmp/fs /data/local/tmp/frida-server
          timeout 30 "$ADB" shell chmod 755 /data/local/tmp/frida-server
          timeout 30 "$ADB" shell 'nohup /data/local/tmp/frida-server >/dev/null 2>&1 &' || true
          sleep 6
          timeout 30 "$ADB" shell 'ps -A | grep frida' || echo "advertencia: frida-server no visible en ps"
          timeout 60 frida-ps -U | head -8 || echo "advertencia: frida-ps sin respuesta"

      - name: Instalar y lanzar la aplicacion instrumentada
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          PKG=$("$ANDROID_HOME/build-tools/30.0.3/aapt" dump badging sample.apk | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          echo "paquete instalado: $PKG"
          echo "PKG=$PKG" >> "$GITHUB_ENV"
          timeout 300 "$ADB" install -r sample.apk
          timeout 330 python3 scripts/frida/run_hooks.py "$PKG" scripts/frida/hooks.js dynamic/logs/frida_hooks.txt 300 \
            || { echo "frida fallo, lanzamiento alternativo con monkey"; timeout 60 "$ADB" shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1; }

      - name: Tiempo de observacion y recoleccion de datos
        if: always()
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          PKG="${PKG:-com.example.lol}"
          sleep 90
          timeout 90 "$ADB" logcat -d -v time > dynamic/logs/logcat.txt 2>&1 || true
          timeout 60 "$ADB" logcat -d -b crash -v time > dynamic/logs/logcat_crash.txt 2>&1 || true
          timeout 30 "$ADB" root || true
          sleep 3
          timeout 60 "$ADB" shell "find /data/data/$PKG -type f" > dynamic/logs/archivos_app.txt 2>&1 || true
          timeout 90 "$ADB" shell "cd /data/data && tar -cf - --exclude='*/cache/*' $PKG 2>/dev/null" | tar -xf - -C dynamic/files_app 2>/dev/null || true
          echo "archivos recuperados:"; find dynamic/files_app -type f | head -30 || true
          pkill -INT mitmdump || true
          sleep 5
          find dynamic -type f -size +15M -exec gzip -f {} \; || true

      - name: Subir artefactos de la ejecucion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-dinamicos
          path: dynamic/
          if-no-files-found: warn

      - name: Publicar resultados en el repositorio
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dynamic/ || true
          git commit -m "Resultados de analisis dinamico: capturas de trafico, logcat y hooks de Frida" || echo "sin cambios que publicar"
          git push
